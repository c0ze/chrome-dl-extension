<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>yt-dlp Downloads</title>
    <link rel="stylesheet" href="download.css">
  </head>
  <body>
    <main class="layout">
      <div class="column column-picker">
      <section class="hero">
        <p class="eyebrow">yt-dlp Bridge</p>
        <h1>Choose Download Folder</h1>
        <p class="lead">
          Pick where this video should go. Your last 10 folders stay here for
          quick reuse.
        </p>
      </section>

      <section id="message" class="message hidden"></section>

      <section class="panel">
        <p class="label">Target URL</p>
        <code id="target-url" class="target-url">Loading…</code>
      </section>

      <section class="panel">
        <form id="download-form" class="form">
          <label class="field-label" for="download-dir">Folder path</label>
          <div class="folder-row">
            <input
              id="download-dir"
              type="text"
              placeholder="~/Downloads"
              autocomplete="off"
              spellcheck="false"
            >
            <button id="browse-button" type="button" class="button button-small">
              Choose Folder…
            </button>
          </div>

          <div class="button-row">
            <button id="download-button" type="submit" class="button">
              Start Download
            </button>
            <button id="default-button" type="button" class="button button-muted">
              Use Default
            </button>
            <button
              id="rescan-button"
              type="button"
              class="button button-muted hidden"
              title="Scan the profile media page for videos again"
            >
              Scan Again
            </button>
          </div>
        </form>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div>
            <p class="label">Recent Folders</p>
            <p class="hint">Click any recent folder to download there instantly.</p>
          </div>
        </div>
        <div id="recent-list" class="recent-list"></div>
      </section>
      </div>

      <div class="column column-downloads">
      <section class="panel">
        <div class="panel-header dashboard-header">
          <div>
            <p class="label">Download Dashboard</p>
            <p id="dashboard-summary" class="hint">Checking current jobs…</p>
          </div>
          <div class="dashboard-actions">
            <div class="view-toggle" role="group" aria-label="Download view">
              <button id="view-tiles" type="button" class="view-button" title="Show downloads as tiles">
                Tiles
              </button>
              <button id="view-list" type="button" class="view-button" title="Show downloads as a list">
                List
              </button>
            </div>
            <a class="icon-button link-button" href="library.html" target="_blank" title="Find broken and duplicate videos in your download folder">
              Library Check
            </a>
            <button id="clear-button" type="button" class="icon-button" title="Remove queued, failed, and completed downloads">
              Remove All
            </button>
            <button id="refresh-button" type="button" class="icon-button" title="Refresh downloads">
              Refresh
            </button>
          </div>
        </div>
        <div id="download-list" class="download-list"></div>
      </section>
      </div>

      <div class="column column-handles">
      <section class="panel">
        <div class="panel-header dashboard-header">
          <div>
            <p class="label">Handles</p>
            <p id="handles-summary" class="hint">Loading handles…</p>
          </div>
          <div class="dashboard-actions">
            <button id="add-handle-button" type="button" class="icon-button" title="Follow a handle you have not downloaded from yet">
              Add
            </button>
            <button id="import-button" type="button" class="icon-button" title="Read the handles and groups already in your download folder">
              Import
            </button>
            <button
              id="check-all-button"
              type="button"
              class="icon-button"
              title="Open each profile in a background tab and look for videos you have not downloaded"
            >
              Check All
            </button>
          </div>
        </div>
        <div class="handle-tools">
          <input id="handle-search" type="search" placeholder="Search handles" autocomplete="off" spellcheck="false">
          <select id="handle-sort" title="Order of handles inside a group">
            <option value="name">By name</option>
            <option value="new">New videos first</option>
            <option value="checked">Longest unchecked first</option>
            <option value="videos">Most videos first</option>
          </select>
        </div>
        <datalist id="handle-groups"></datalist>
        <div id="handle-list" class="handle-list"></div>
      </section>
      </div>
    </main>

    <script type="module" src="download.js"></script>
  </body>
</html>
